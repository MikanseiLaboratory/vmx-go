name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        simd: ["scalar", "simd"]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
      GOEXPERIMENT: ${{ matrix.simd == 'simd' && 'simd' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
